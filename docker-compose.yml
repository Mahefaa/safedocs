services:
  file-service:
    build: ./file-service
    container_name: file-service
    ports:
      - "5000:5000"
    networks:
      - app-network
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - app-network
    depends_on:
      - gateway
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "4000:4000"
    networks:
      - app-network
  gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    networks:
      - app-network
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - gateway
    networks:
      - app-network
networks:
  app-network:
    driver: bridge